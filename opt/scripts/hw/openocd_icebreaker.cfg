interface cmsis-dap
# CMSIS-DAP adapter speed
adapter speed 1000
# Enable debugging
gdb_port 3333

# CMSIS-DAP adapter speed
adapter speed 1000

# Target configuration
source [find /mnt/toshiba4tb/workspace/projects/picorv32/opt/scripts/hw/ice40up5k.cfg]

# Reset configuration
reset_config srst_only srst_nogate

# JTAG chain
jtag newtap ice40up5k cpu -irlen 4 -expected-id 0x01000043

target create ice40up5k.cpu cortex_m -chain-position ice40up5k.cpu -coreid 0 -endian little

# Flash configuration
flash bank ice40up5k.flash ftdi 0x00000000 0x10000 0 0 ice40up5k.cpu

# Enable debugging
gdb_port 3333

echo "OpenOCD configuration for IceBreaker board with CMSIS-DAP loaded"