# Ice40UP5K FPGA configuration for OpenOCD
# Interface configuration
interface cmsis-dap
adapter speed 1000

# Target configuration
source [find target/riscv.cfg]

# JTAG chain
jtag newtap ice40up5k cpu -irlen 4 -expected-id 0x01000043

target create ice40up5k.cpu riscv -chain-position ice40up5k.cpu -coreid 0 -endian little

# Reset configuration
reset_config srst_only srst_nogate

# Flash configuration
flash bank ice40up5k.flash ftdi 0x00000000 0x10000 0 0 ice40up5k.cpu

# Enable debugging
gdb_port 3333

echo "Ice40UP5K configuration loaded for OpenOCD"